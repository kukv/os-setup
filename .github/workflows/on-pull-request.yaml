---
name: "on-pull-request"

on:
  pull_request:
jobs:
  check-shell:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout Repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Check with shellcheck"
        uses: "reviewdog/action-shellcheck@0722bbdb0d47f04c1b53b8734d2422ac63a45ec6" # v1.32.1
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          fail_level: "error"
          reporter: "github-pr-review"
          # test/run-in-vm.sh is a zsh script (shellcheck supports only sh/bash/ksh)
          exclude: |
            */.git/*
            */test/run-in-vm.sh

  check-yaml:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout Repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Check with yaml"
        uses: "reviewdog/action-yamllint@de68272fdca5f2a961fb309e0d2e13c2eb186d9e" # v1.23.1
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          level: "error"
          fail_level: "error"
          reporter: "github-pr-review"

  check-ansible:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout Repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Set up Python"
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
        with:
          python-version: "3.x"

      # Install ansible-lint and the required collection into the SAME
      # environment so ansible-lint's syntax-check can resolve
      # community.general modules (the ansible-lint action installs them into
      # a separate env, leaving the collection unresolvable).
      - name: "Install ansible-lint and collections"
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yaml

      - name: "Check with ansible-lint"
        working-directory: "./ansible"
        run: "ansible-lint --config-file .ansible-lint"
