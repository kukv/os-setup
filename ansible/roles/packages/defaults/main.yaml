---
# Debian (WSL) — from wsl-setup dev_setup install_prerequisite_packages.yaml / setup_golang.yaml
ruby_build_packages:
  - "libssl-dev"
  - "libyaml-dev"
  - "zlib1g-dev"
  - "libgmp-dev"
  - "libffi-dev"
  - "autoconf"
  - "rustc"
arm_cross_packages:
  - "qemu-system-arm"        # Required for binary builds for arm
  - "g++-aarch64-linux-gnu"  # Required for binary builds for arm64

# Darwin (macOS) — from mac-setup homebrew/defaults/main.yaml (chezmoi added)
homebrew:
  formulae:
    - "git"
    - "mise"
    - "chezmoi"
    - "tree"
    - "nkf"
    - "ffmpeg"
    - "plantuml"
    - "nmap"
    - "gnupg"
    - "mas"
    - "cirruslabs/cli/tart"
  casks:
    - "font-hack-nerd-font"
    - "google-chrome"
    - "visual-studio-code"
    - "raycast"
    - "1password"
    - "1password-cli"
    - "jetbrains-toolbox"
    - "slack"
    - "notion"
    - "discord"
    - "iterm2"
    - "spotify"
    - "clipy"
    - "daisydisk"
    - "thebrowsercompany-dia"
    - "onyx"
    - "raspberry-pi-imager"
    - "vnc-viewer"
    - "drawio"
    - "docker-desktop"
    - "zoom"
    - "linear"
    - "cloudflare-warp"
    - "onedrive"
    - "logi-options+"
    - "microsoft-office"

# Mac App Store apps installed via `mas` (requires App Store sign-in)
mas_apps:
  - id: "539883307"
    name: "LINE"
  - id: "302584613"
    name: "Amazon Kindle"
  - id: "497799835"
    name: "Xcode"
