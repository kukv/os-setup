---
- name: "Ensure chezmoi config directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/chezmoi"
    state: "directory"
    mode: "0700"

- name: "Seed chezmoi data (git identity)"
  ansible.builtin.template:
    src: "chezmoi.toml.j2"
    dest: "{{ ansible_facts.user_dir }}/.config/chezmoi/chezmoi.toml"
    mode: "0600"

- name: "Apply dotfiles via chezmoi"
  ansible.builtin.command:
    cmd: "{{ brew_bin_dir }}/chezmoi init --apply {{ dotfiles_repo_url }}"
  environment:
    PATH: "{{ brew_bin_dir }}:{{ ansible_facts.env.PATH }}"
  register: "chezmoi_apply"
  changed_when: "chezmoi_apply.rc == 0"

- name: "Install mise tools"
  ansible.builtin.command:
    cmd: "{{ brew_bin_dir }}/mise install --yes"
  environment:
    PATH: "{{ brew_bin_dir }}:{{ ansible_facts.env.PATH }}"
    MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: "60"
    MISE_GITHUB_TOKEN: "{{ github_token | default(omit) }}"
  register: "mise_install"
  until: "mise_install is succeeded"
  retries: 3
  delay: 10
  changed_when: "'installed' in mise_install.stdout or 'installed' in mise_install.stderr"

- name: "Install default Go packages"
  ansible.builtin.command:
    cmd: "{{ brew_bin_dir }}/mise exec go -- go install {{ item }}"
  environment:
    PATH: "{{ brew_bin_dir }}:{{ ansible_facts.env.PATH }}"
  loop: "{{ go.default_packages }}"
  changed_when: false

- name: "Enable Node corepack"
  ansible.builtin.command:
    cmd: "{{ brew_bin_dir }}/mise exec node -- corepack enable"
  environment:
    PATH: "{{ brew_bin_dir }}:{{ ansible_facts.env.PATH }}"
  changed_when: false
