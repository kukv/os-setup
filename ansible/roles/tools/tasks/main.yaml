---
- name: "Ensure chezmoi config directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/chezmoi"
    state: "directory"
    mode: "0700"

- name: "Seed chezmoi data (git identity)"
  ansible.builtin.template:
    src: "chezmoi.toml.j2"
    dest: "{{ ansible_facts.user_dir }}/.config/chezmoi/chezmoi.toml"
    mode: "0600"

- name: "Initialize chezmoi source on first run"
  ansible.builtin.command:
    cmd: "{{ brew_bin_dir }}/chezmoi init {{ dotfiles_repo_url }}"
  args:
    # Only clones on the first run; chezmoi init does not pull an existing source.
    creates: "{{ ansible_facts.user_dir }}/.local/share/chezmoi/.git"
  environment:
    PATH: "{{ brew_bin_dir }}:{{ ansible_facts.env.PATH }}"

- name: "Pull latest dotfiles and apply via chezmoi"
  ansible.builtin.command:
    # `chezmoi update` runs `git pull --autostash --rebase` then `chezmoi apply`,
    # so scheduled runs pick up the latest dotfiles. `--force` overwrites files
    # changed at runtime (e.g. .claude/settings.json) without a TTY prompt.
    cmd: "{{ brew_bin_dir }}/chezmoi update --force"
  environment:
    PATH: "{{ brew_bin_dir }}:{{ ansible_facts.env.PATH }}"
  register: "chezmoi_update"
  changed_when: "chezmoi_update.rc == 0"

- name: "Disable Node corepack shims"
  ansible.builtin.command:
    # corepack の shim は node の bin 配下に置かれ、mise が [tools] で管理する
    # pnpm / yarn を PATH 上で覆い隠す。その結果 mise の npm backend が意図しない
    # pnpm を掴んで ERR_PNPM_NO_GLOBAL_BIN_DIR で失敗するため、shim は無効化して
    # pnpm / yarn は mise に一本化する。
    cmd: "{{ brew_bin_dir }}/mise exec node -- corepack disable"
  args:
    # shim が無ければ実行不要。node 未導入の初回実行もここでスキップされる。
    removes: "{{ ansible_facts.user_dir }}/.local/share/mise/installs/node/*/bin/pnpm"
  environment:
    PATH: "{{ brew_bin_dir }}:{{ ansible_facts.env.PATH }}"

- name: "Install mise tools"
  ansible.builtin.command:
    cmd: "{{ brew_bin_dir }}/mise install --yes"
  environment:
    PATH: "{{ brew_bin_dir }}:{{ ansible_facts.env.PATH }}"
    MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: "60"
    MISE_GITHUB_TOKEN: "{{ github_token | default(omit) }}"
  register: "mise_install"
  until: "mise_install is succeeded"
  retries: 3
  delay: 10
  changed_when: "'installed' in mise_install.stdout or 'installed' in mise_install.stderr"

- name: "Install herdr plugins"
  ansible.builtin.command:
    # インストール先はハッシュ付きディレクトリになるため、creates は glob で判定する。
    cmd: "{{ brew_bin_dir }}/mise exec -- herdr plugin install {{ item.repo }} --yes"
  args:
    creates: "{{ ansible_facts.user_dir }}/.config/herdr/plugins/github/{{ item.id }}-*"
  environment:
    PATH: "{{ brew_bin_dir }}:{{ ansible_facts.env.PATH }}"
  loop: "{{ herdr.plugins }}"

- name: "Install Claude Code skills"
  ansible.builtin.command:
    # skills CLI は lockfile からの復元コマンドを持たないため、入れたいスキルを defaults で
    # 宣言し、グローバル (~/.claude/skills) へ導入する。
    cmd: "{{ brew_bin_dir }}/mise exec -- skills add {{ item.repo }} --skill {{ item.name }} --agent claude-code --global --yes"
  args:
    creates: "{{ ansible_facts.user_dir }}/.claude/skills/{{ item.name }}"
  environment:
    PATH: "{{ brew_bin_dir }}:{{ ansible_facts.env.PATH }}"
  loop: "{{ agents.skills }}"
