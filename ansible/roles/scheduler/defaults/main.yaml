---
# --- Debian (WSL, systemd timer) ---
# systemd OnCalendar expression; see systemd.time(7). Override via extra_vars.
provisioning_schedule: "weekly"

# --- Darwin (macOS, launchd LaunchAgent) ---
scheduled:
  repo_url: "https://github.com/kukv/os-setup.git"
  branch: "main"
  weekday: 7
  hour: 21
  minute: 0
  log_dir: "{{ ansible_facts.user_dir }}/.local/log/ansible"
  log_retention_days: 90
