---
- name: "Install WSL utility packages"
  ansible.builtin.apt:
    name:
      - "wslu"
    state: "present"
  when: "ansible_facts.distribution_version is version('26.04', '<')"

- name: "Create /etc/wsl.conf"
  ansible.builtin.template:
    src: "wsl.conf.j2"
    dest: "/etc/wsl.conf"
    owner: "root"
    group: "root"
    mode: "0644"

# On WSL the systemd-resolved stub (127.0.0.53) is taken over by the WSL DNS
# proxy, which breaks name resolution. Bypass the stub by pointing resolv.conf
# at the uplink file that lists the upstream DNS servers directly.
- name: "Point /etc/resolv.conf to systemd-resolved uplink servers"
  ansible.builtin.file:
    src: "../run/systemd/resolve/resolv.conf"
    dest: "/etc/resolv.conf"
    state: "link"
    force: true
    follow: false

# WSL registers the WSLInterop binfmt early in boot, but systemd-binfmt.service
# then resets binfmt_misc and re-registers only /etc/binfmt.d entries, dropping
# WSLInterop. That breaks running Windows executables from WSL (ssh.exe,
# op-ssh-sign-wsl.exe, ...). Re-declare it under /etc/binfmt.d so systemd keeps it.
#
# Note: WSL's own host registration uses flags "PF", but we must NOT set the "F"
# (fix-binary) flag here. "F" makes the kernel open the interpreter (/init) at
# registration time; when systemd-binfmt re-applies this rule that open fails and
# the write to /proc/sys/fs/binfmt_misc/register errors out, so the whole unit
# exits non-zero ("Job for systemd-binfmt.service failed ..."). Register with "P"
# (preserve-argv0) only, which is what a running WSL exposes for WSLInterop.
- name: "Ensure /etc/binfmt.d exists"
  ansible.builtin.file:
    path: "/etc/binfmt.d"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: "Persist WSL interop binfmt across systemd's binfmt reset"
  ansible.builtin.copy:
    content: ":WSLInterop:M::MZ::/init:P\n"
    dest: "/etc/binfmt.d/WSLInterop.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart systemd-binfmt"
