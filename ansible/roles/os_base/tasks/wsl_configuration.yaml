---
- name: "Install requirement packages"
  ansible.builtin.apt:
    name:
      - "wslu"
    state: "present"
  when: "ansible_facts.distribution_version is version('26.04', '<')"

- name: "Create /etc/wsl.conf"
  ansible.builtin.template:
    src: "wsl.conf.j2"
    dest: "/etc/wsl.conf"
    owner: "root"
    group: "root"
    mode: "0644"
